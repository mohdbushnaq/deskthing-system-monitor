name: Release

# Bump "version" in deskthing/manifest.json and push to main: this builds the app and publishes
# release v<version> if it doesn't exist yet. DeskThing reads latest.json from the latest release to offer updates.
on:
  push:
    branches: [main]
    paths: ['deskthing/manifest.json', 'server/**', 'src/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Publish release for the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./deskthing/manifest.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump the version in deskthing/manifest.json to publish a new one."
            exit 0
          fi
          gh release create "$tag" dist/sysmon-*.zip dist/latest.json \
            --target "${GITHUB_SHA}" \
            --title "System Monitor $tag" \
            --notes-file .github/release-notes.md
