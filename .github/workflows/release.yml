name: Release

# Push a tag like v1.3.0 to build the app and publish a GitHub release.
# DeskThing reads latest.json from the latest release to offer updates.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Check the tag matches the manifest version
        run: |
          v=$(node -p "require('./deskthing/manifest.json').version")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match manifest version $v"; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/sysmon-*.zip dist/latest.json \
            --title "System Monitor ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
